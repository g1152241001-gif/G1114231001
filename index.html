<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDGs 不塑永續-淨灘</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }
        @keyframes waveMove {
            0% { transform: translateX(0) translateZ(0) scaleY(1); }
            50% { transform: translateX(-25%) translateZ(0) scaleY(1.1); }
            100% { transform: translateX(-50%) translateZ(0) scaleY(1); }
        }
        .wave-animation {
            animation: waveMove 6s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
        }
        .wave-animation2 {
            animation: waveMove 4s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite reverse;
            opacity: 0.6;
        }
        @keyframes driftCloud {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(calc(100vw + 200px)); }
        }
        .cloud-1 { animation: driftCloud 35s linear infinite; }
        .cloud-2 { animation: driftCloud 48s linear infinite; animation-delay: -15s; }
        .cloud-3 { animation: driftCloud 28s linear infinite; animation-delay: -8s; }

        @keyframes sailBoat {
            0% { transform: translateX(-120px) translateY(0) rotate(0deg); }
            25% { transform: translateX(calc(25vw)) translateY(-3px) rotate(1.5deg); }
            50% { transform: translateX(calc(50vw)) translateY(2px) rotate(-1deg); }
            75% { transform: translateX(calc(75vw)) translateY(-2px) rotate(1deg); }
            100% { transform: translateX(calc(100vw + 150px)) translateY(0) rotate(0deg); }
        }
        .boat-container {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes rockBoat {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }
        .boat-rock {
            animation: rockBoat 3s ease-in-out infinite;
            transform-origin: bottom center;
        }
        /* Capsized boat effect */
        .capsized {
            transform: translateY(20px) rotate(135deg) scale(0.9) !important;
            filter: grayscale(0.6) brightness(0.8);
            transition: transform 0.6s ease-out, filter 0.6s ease-out;
        }

        @keyframes floatTrash {
            0% { transform: translateY(0px) rotate(var(--rot)); }
            50% { transform: translateY(-6px) rotate(calc(var(--rot) + 4deg)); }
            100% { transform: translateY(0px) rotate(var(--rot)); }
        }
        .trash-item {
            animation: floatTrash 3.5s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s;
        }
        .trash-item:hover {
            transform: scale(1.2) rotate(var(--rot)) !important;
            filter: drop-shadow(0 12px 10px rgba(0, 0, 0, 0.3));
        }

        @keyframes fireCannonball {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--target-x), var(--target-y)) scale(1.2); opacity: 0.9; }
        }
        .cannonball {
            position: absolute;
            bottom: 48%;
            left: 50%;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.9);
            animation: fireCannonball 0.55s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 45;
        }

        @keyframes scorePopup {
            0% { transform: scale(0.6) translateY(0); opacity: 1; }
            100% { transform: scale(1.4) translateY(-50px); opacity: 0; }
        }
        .score-anim {
            position: absolute;
            animation: scorePopup 0.7s ease-out forwards;
            font-weight: 900;
            pointer-events: none;
            z-index: 60;
        }
        @keyframes comboPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); color: #f59e0b; }
            100% { transform: scale(1); }
        }
        .combo-pulse {
            animation: comboPulse 0.3s ease-in-out;
        }
    </style>
</head>
<body class="relative w-screen h-screen m-0 p-0 flex flex-col justify-between bg-gradient-to-b from-sky-300 via-sky-200 to-amber-100">

    <div class="absolute inset-0 flex flex-col pointer-events-none z-0 overflow-hidden">
        <!-- Sky Area (Top 35%) -->
        <div class="h-[35%] w-full relative bg-gradient-to-b from-sky-400 to-sky-200 overflow-hidden">
            <!-- Sun with glow -->
            <div class="absolute top-6 right-16 w-20 h-20 bg-amber-100 rounded-full blur-[1px] shadow-[0_0_50px_rgba(253,230,138,0.9)]"></div>
            
            <!-- Drifting Clouds -->
            <div class="absolute top-6 left-0 cloud-1 flex items-center opacity-85">
                <div class="w-32 h-10 bg-white rounded-full blur-[0.5px]"></div>
                <div class="w-16 h-12 bg-white rounded-full -ml-8 -mt-3 blur-[0.5px]"></div>
            </div>
            <div class="absolute top-16 left-0 cloud-2 flex items-center opacity-70 scale-75">
                <div class="w-40 h-12 bg-white rounded-full"></div>
                <div class="w-20 h-16 bg-white rounded-full -ml-10 -mt-4"></div>
            </div>
            <div class="absolute top-4 left-0 cloud-3 flex items-center opacity-60 scale-90">
                <div class="w-28 h-9 bg-white rounded-full"></div>
                <div class="w-14 h-10 bg-white rounded-full -ml-6 -mt-3"></div>
            </div>

            <!-- Palm Tree Silhouette on Left -->
            <div class="absolute bottom-0 left-6 w-24 h-32 opacity-25 flex items-end">
                <svg viewBox="0 0 100 100" class="w-full h-full fill-emerald-900">
                    <path d="M45 100 L55 100 L58 40 L50 20 L42 40 Z"/>
                    <path d="M50 30 C30 10 10 20 5 25 C20 30 35 35 50 30 Z"/>
                    <path d="M50 30 C70 10 90 20 95 25 C80 30 65 35 50 30 Z"/>
                    <path d="M50 35 C30 25 5 35 2 45 C20 45 35 40 50 35 Z"/>
                    <path d="M50 35 C70 25 95 35 98 45 C80 45 65 40 50 35 Z"/>
                </svg>
            </div>
        </div>

        <!-- Ocean & Animated Waves (Middle 15%) -->
        <div class="h-[15%] w-full bg-cyan-500 relative overflow-hidden" id="oceanContainer">
            <!-- Multiple Sailing Boats Container -->
            <div id="boatsContainer" class="absolute inset-0 z-10 pointer-events-auto"></div>

            <!-- Wave layer 1 -->
            <div class="absolute bottom-0 left-0 w-[200%] h-8 bg-cyan-300 opacity-70 wave-animation" style="border-radius: 100% 100% 0 0;"></div>
            <!-- Wave layer 2 -->
            <div class="absolute bottom-2 left-0 w-[200%] h-6 bg-white opacity-40 wave-animation2" style="border-radius: 100% 100% 0 0;"></div>
        </div>

        <!-- Beach Sand Area (Bottom 50%) -->
        <div class="h-[50%] w-full bg-gradient-to-b from-amber-100 via-amber-200 to-amber-300 relative border-t-4 border-amber-300/60">
            <!-- Sand texture pattern -->
            <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#b45309_1.5px,transparent_1.5px)] [background-size:18px_18px]"></div>
        </div>
    </div>

    <header class="relative z-30 w-full px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pointer-events-auto">
        <!-- Title on Top-Left -->
        <div class="bg-white/85 backdrop-blur-md px-5 py-3 rounded-2xl shadow-xl border border-white/60">
            <h1 class="text-2xl sm:text-3xl font-black text-emerald-700 tracking-wide drop-shadow-sm flex items-center gap-2">
                🌊 SDGs 不塑永續-淨灘 <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">進階防衛版</span>
            </h1>
            <p class="text-xs sm:text-sm text-slate-600 font-medium mt-0.5">點擊垃圾清理沙灘，或使用「炮擊鍵」防衛多艘入侵小船！</p>
        </div>

        <!-- Stats and Controls on Top-Right -->
        <div class="flex flex-wrap items-center gap-3">
            <!-- Cannon Firing Button -->
            <button onclick="fireCannon()" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-700 hover:to-cyan-700 text-white px-4 py-3 rounded-2xl shadow-xl font-bold flex items-center gap-2 active:scale-95 transition-all border border-blue-400/50" title="發射環保水砲 (快速鍵: 空白鍵)">
                <span class="text-xl">💥</span>
                <span class="text-sm sm:text-base">炮擊小船</span>
            </button>

            <!-- Mode / Timer Badge -->
            <div id="timerContainer" class="bg-white/85 backdrop-blur-md px-4 py-3 rounded-2xl shadow-xl border border-white/60 flex items-center gap-2">
                <span class="text-xl">⏳</span>
                <div>
                    <div class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">剩餘時間</div>
                    <div id="timerDisplay" class="text-xl font-black text-rose-500">45s</div>
                </div>
            </div>

            <!-- Score Badge -->
            <div class="bg-white/85 backdrop-blur-md px-4 py-3 rounded-2xl shadow-xl border border-white/60 text-right">
                <div class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">目前積分</div>
                <div id="scoreDisplay" class="text-2xl font-black text-amber-600">0</div>
            </div>

            <!-- Remaining Trash Badge -->
            <div class="bg-white/85 backdrop-blur-md px-4 py-3 rounded-2xl shadow-xl border border-white/60 text-right">
                <div class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">剩餘垃圾</div>
                <div id="countDisplay" class="text-2xl font-black text-rose-600">50</div>
            </div>

            <!-- Sound Toggle Button -->
            <button onclick="toggleSound()" id="soundBtn" class="bg-white/85 backdrop-blur-md p-3.5 rounded-2xl shadow-xl border border-white/60 text-slate-700 hover:bg-white active:scale-95 transition-all text-xl" title="音效開關">
                🔊
            </button>
        </div>
    </header>

    <div id="comboBanner" class="absolute top-28 left-1/2 transform -translate-x-1/2 z-30 pointer-events-none transition-all duration-300 opacity-0 scale-50">
        <div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white font-black px-6 py-2 rounded-full shadow-2xl text-xl tracking-wider border-2 border-white">
            🔥 COMBO <span id="comboCount">2</span>x 連擊！
        </div>
    </div>

    <main id="playfield" class="absolute inset-0 z-20 pointer-events-none">
        <!-- Dynamically injected trash items -->
    </main>

    <div id="factModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 shadow-2xl text-center transform scale-95 transition-transform duration-300 border-4 border-emerald-400" id="factContent">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-inner">
                🐢
            </div>
            <h2 id="factTitle" class="text-2xl font-black text-slate-800 mb-2">發現神祕環保寶箱！</h2>
            <p id="factText" class="text-slate-600 mb-6 text-sm leading-relaxed">
                塑膠微粒會透過食物鏈進入海洋生物體內，最終影響人類健康。減少使用一次性塑膠製品是保護海洋的關鍵！
            </p>
            <button onclick="closeFactModal()" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-base rounded-2xl shadow-lg shadow-emerald-500/30 active:scale-95 transition-all">
                繼續淨灘！ (+50 獎勵分)
            </button>
        </div>
    </div>

    <div id="victoryModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 shadow-2xl text-center transform scale-95 transition-transform duration-300" id="modalContent">
            <div id="modalIcon" class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-inner">
                🎉
            </div>
            <h2 id="modalTitle" class="text-3xl font-black text-slate-800 mb-2">任務成功！</h2>
            <p id="modalDesc" class="text-slate-600 mb-6 text-base leading-relaxed">
                太棒了！你在限時內將沙灘上的垃圾全數清理乾淨，守護了美麗的海洋！
            </p>
            <!-- Stars Rating -->
            <div id="starRating" class="flex justify-center gap-2 text-3xl mb-4">
                ⭐ ⭐ ⭐
            </div>
            <div class="bg-slate-50 rounded-2xl p-4 mb-6 border border-slate-100 flex justify-around">
                <div>
                    <div class="text-xs text-slate-500">最終總得分</div>
                    <div id="finalScore" class="text-3xl font-black text-emerald-600 mt-1">0 分</div>
                </div>
                <div class="border-l border-slate-200 pl-6">
                    <div class="text-xs text-slate-500">歷史最高分</div>
                    <div id="highScore" class="text-3xl font-black text-amber-500 mt-1">0 分</div>
                </div>
            </div>
            <button onclick="restartGame()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-lg rounded-2xl shadow-lg shadow-emerald-500/30 active:scale-95 transition-all">
                前往下一關 / 再玩一次
            </button>
        </div>
    </div>

    <script>
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'collect') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'cannon') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.3);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'explosion') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.5);
                gainNode.gain.setValueAtTime(0.4, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'chest') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(500, now + 0.1);
                osc.frequency.setValueAtTime(700, now + 0.2);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'win') {
                osc.type = 'sine';
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((note, index) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(note, now + index * 0.12);
                    g.gain.setValueAtTime(0.2, now + index * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + index * 0.12 + 0.3);
                    o.start(now + index * 0.12);
                    o.stop(now + index * 0.12 + 0.3);
                });
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.4);
                gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
        }

        /* Trash and eco data definitions */
        const trashTypes = [
            { name: '保麗龍', points: 3, sizeClass: 'w-16 h-12 sm:w-20 sm:h-14', svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow-md"><rect x="10" y="16" width="44" height="32" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/><path d="M18 24h28M18 32h28M18 40h20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><circle cx="22" cy="20" r="1.5" fill="#94a3b8"/><circle cx="34" cy="36" r="1.5" fill="#94a3b8"/></svg>` },
            { name: '紙類餐盒', points: 3, sizeClass: 'w-16 h-14 sm:w-20 sm:h-16', svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow-md"><path d="M12 20l6-8h28l6 8v30a4 4 0 01-4 4H16a4 4 0 01-4-4V20z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/><path d="M12 20h40" stroke="#ca8a04" stroke-width="2"/><path d="M22 28h20M26 36h12" stroke="#eab308" stroke-width="2" stroke-linecap="round"/></svg>` },
            { name: '寶特瓶', points: 2, sizeClass: 'w-10 h-16 sm:w-12 sm:h-20', svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow-md"><path d="M26 8h12v6H26z" fill="#64748b"/><path d="M22 14h20v8l6 8v28a4 4 0 01-4 4H20a4 4 0 01-4-4V30l6-8v-8z" fill="#38bdf8" fill-opacity="0.7" stroke="#0284c7" stroke-width="2"/><path d="M24 34h16M24 44h16" stroke="#bae6fd" stroke-width="2"/></svg>` },
            { name: '飲料杯', points: 2, sizeClass: 'w-12 h-16 sm:w-14 sm:h-20', svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow-md"><path d="M18 12h28l-4 44H22l-4-44z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><ellipse cx="32" cy="12" rx="14" ry="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/><path d="M30 4l4-4h4l-2 4z" fill="#f43f5e"/><path d="M22 24h20M24 34h16" stroke="#e2e8f0" stroke-width="2"/></svg>` },
            { name: '廢棄漁網', points: 3, sizeClass: 'w-16 h-14 sm:w-20 sm:h-16', svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow-md"><path d="M12 20c10 5 15 15 24 10s14-16 26-10M12 36c10 5 15 15 24 10s14-16 26-10M18 16c5 10 5 20 10 30M36 16c5 10 5 20 10 30" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/></svg>` },
            { name: '塑膠袋', points: 1, sizeClass: 'w-14 h-14 sm:w-16 sm:h-16', svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow-md"><path d="M24 16c0-6 4-10 8-10s8 4 8 10v4H24v-4z" fill="none" stroke="#94a3b8" stroke-width="2"/><path d="M16 20c-2 0-4 2-4 4v32a4 4 0 004 4h32a4 4 0 004-4V24c0-2-2-4-4-4H16z" fill="#e2e8f0" fill-opacity="0.8" stroke="#94a3b8" stroke-width="2"/><path d="M22 30c8 4 12 4 20 0" stroke="#cbd5e1" stroke-width="2" fill="none"/></svg>` },
            { name: '吸管', points: 1, sizeClass: 'w-16 h-8 sm:w-20 sm:h-10', svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow-md"><path d="M12 48l36-32" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/></svg>` },
            { name: '電池', points: 2, sizeClass: 'w-8 h-12 sm:w-10 sm:h-14', svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow-md"><rect x="22" y="14" width="20" height="42" rx="4" fill="#334155" stroke="#1e293b" stroke-width="2"/><rect x="28" y="8" width="8" height="6" rx="1" fill="#94a3b8"/><path d="M26 26h12M26 38h12M32 32v12" stroke="#eab308" stroke-width="2" stroke-linecap="round"/></svg>` }
        ];

        const ecoFacts = [
            { title: "海洋塑膠危機", text: "預計到 2050 年，海洋裡的塑膠垃圾重量將會超過魚類總數！減少一次性塑膠是當務之急。" },
            { title: "海龜與塑膠袋", text: "海龜常把飄 in 水中的塑膠袋誤認為水母而誤食，導致消化道阻塞。做好垃圾分類與減塑能拯救無數生命！" },
            { title: "吸管的危害", text: "塑膠吸管質輕且體積小，極易被風吹入海中且難以回收。拒絕塑膠吸管，改用不鏽鋼或紙吸管吧！" },
            { title: "電池汙染源", text: "一顆廢電池若隨意丟棄，能汙染數百公噸的水源與大片土地。確實回收電池，守護地球生態！" }
        ];

        let score = 0;
        let remainingTrash = 50;
        let timer = 45;
        let timerInterval = null;
        let gameActive = false;
        let combo = 0;
        let comboTimeout = null;
        let specialChestSpawned = false;
        let boatIdCounter = 0;
        let activeBoats = [];

        function initGame() {
            const playfield = document.getElementById('playfield');
            playfield.innerHTML = '';
            score = 0;
            remainingTrash = 50;
            timer = 45;
            combo = 0;
            specialChestSpawned = false;
            activeBoats = [];
            gameActive = true;
            updateUI();

            document.getElementById('victoryModal').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('modalContent').classList.add('scale-95');
            document.getElementById('factModal').classList.add('opacity-0', 'pointer-events-none');

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timer--;
                document.getElementById('timerDisplay').textContent = `${timer}s`;
                if (timer <= 0) {
                    clearInterval(timerInterval);
                    endGame(false);
                }
            }, 1000);

            // Initialize 4 sailing boats with different speeds and scales
            initBoats();

            for (let i = 0; i < 50; i++) {
                const trashType = trashTypes[Math.floor(Math.random() * trashTypes.length)];
                const item = document.createElement('div');
                
                const topPos = Math.floor(Math.random() * 42) + 48;
                const leftPos = Math.floor(Math.random() * 88) + 3;
                const rotation = Math.floor(Math.random() * 360);

                item.className = `absolute pointer-events-auto trash-item ${trashType.sizeClass}`;
                item.style.top = `${topPos}%`;
                item.style.left = `${leftPos}%`;
                item.style.setProperty('--rot', `${rotation}deg`);
                item.style.transform = `rotate(${rotation}deg)`;
                item.innerHTML = trashType.svg;

                item.addEventListener('click', (e) => collectTrash(e, item, trashType.points));
                item.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    collectTrash(e, item, trashType.points);
                }, { passive: false });

                playfield.appendChild(item);
            }

            setTimeout(() => {
                if (gameActive && !specialChestSpawned) {
                    spawnSpecialChest();
                }
            }, 12000);
        }

        function initBoats() {
            const container = document.getElementById('boatsContainer');
            container.innerHTML = '';
            
            const boatConfigs = [
                { speed: 38, scale: 'scale-90', top: '2px' },
                { speed: 52, scale: 'scale-75', top: '-4px' },
                { speed: 45, scale: 'scale-105', top: '8px' },
                { speed: 60, scale: 'scale-65', top: '12px' }
            ];

            boatConfigs.forEach((config, idx) => {
                const boatId = `boat_${boatIdCounter++}`;
                const boatEl = document.createElement('div');
                boatEl.id = boatId;
                boatEl.className = `absolute boat-container ${config.scale} cursor-pointer`;
                boatEl.style.top = config.top;
                boatEl.style.animation = `sailBoat ${config.speed}s linear infinite`;
                boatEl.style.animationDelay = `${-idx * (config.speed / 4)}s`;

                boatEl.innerHTML = `
                    <div class="boat-rock w-14 h-14 flex items-end justify-center">
                        <svg viewBox="0 0 100 80" class="w-12 h-12 drop-shadow-md">
                            <!-- Hull -->
                            <path d="M10 50 Q50 75 90 50 L75 65 Q50 72 25 65 Z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
                            <!-- Mast -->
                            <path d="M50 15 L50 55" stroke="#451a03" stroke-width="3" stroke-linecap="round"/>
                            <!-- Sails -->
                            <path d="M52 18 Q75 30 52 48 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
                            <path d="M48 22 Q25 35 48 50 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
                            <!-- Flag -->
                            <path d="M50 15 L62 19 L50 23 Z" fill="#ef4444"/>
                        </svg>
                    </div>
                `;

                boatEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    fireCannonAtSpecificBoat(boatEl);
                });
                boatEl.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    fireCannonAtSpecificBoat(boatEl);
                }, { passive: false });

                container.appendChild(boatEl);
                activeBoats.push({ id: boatId, element: boatEl, capsized: false });
            });
        }

        function spawnSpecialChest() {
            specialChestSpawned = true;
            const playfield = document.getElementById('playfield');
            const chest = document.createElement('div');
            const topPos = Math.floor(Math.random() * 35) + 52;
            const leftPos = Math.floor(Math.random() * 80) + 10;

            chest.className = `absolute pointer-events-auto trash-item w-16 h-16 sm:w-20 sm:h-20 cursor-pointer`;
            chest.style.top = `${topPos}%`;
            chest.style.left = `${leftPos}%`;
            chest.style.setProperty('--rot', '0deg');
            chest.innerHTML = `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow-xl animate-bounce"><rect x="12" y="24" width="40" height="30" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="2"/><path d="M12 24l20-12 20 12z" fill="#d97706" stroke="#b45309" stroke-width="2"/><rect x="28" y="32" width="8" height="10" rx="2" fill="#fef08a"/></svg>`;

            chest.addEventListener('click', () => triggerEcoChest());
            chest.addEventListener('touchstart', (e) => { e.preventDefault(); triggerEcoChest(); });
            playfield.appendChild(chest);
        }

        function triggerEcoChest() {
            playSound('chest');
            gameActive = false;
            score += 50;
            updateUI();

            const randomFact = ecoFacts[Math.floor(Math.random() * ecoFacts.length)];
            document.getElementById('factTitle').textContent = `🎁 ${randomFact.title}`;
            document.getElementById('factText').textContent = randomFact.text;

            const modal = document.getElementById('factModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('factContent').classList.remove('scale-95');
        }

        function closeFactModal() {
            const modal = document.getElementById('factModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('factContent').classList.add('scale-95');
            gameActive = true;
        }

        function fireCannon() {
            if (!gameActive) return;
            const targetable = activeBoats.filter(b => !b.capsized);
            const targetBoat = targetable.length > 0 ? targetable[Math.floor(Math.random() * targetable.length)] : activeBoats[0];
            if (targetBoat) {
                fireCannonAtSpecificBoat(targetBoat.element);
            }
        }

        function fireCannonAtSpecificBoat(boatEl) {
            if (!gameActive) return;
            playSound('cannon');

            const ball = document.createElement('div');
            ball.className = 'cannonball';
            
            const boatRect = boatEl.getBoundingClientRect();
            const startX = window.innerWidth / 2;
            const startY = window.innerHeight * 0.52;
            const targetX = boatRect.left + boatRect.width / 2 - startX;
            const targetY = boatRect.top + boatRect.height / 2 - startY;

            ball.style.setProperty('--target-x', `${targetX}px`);
            ball.style.setProperty('--target-y', `${targetY}px`);
            document.body.appendChild(ball);

            setTimeout(() => {
                ball.remove();
                hitBoatEffect(boatRect.left + boatRect.width / 2, boatRect.top + boatRect.height / 2, boatEl);
            }, 550);
        }

        function hitBoatEffect(x, y, boatEl) {
            playSound('explosion');
            
            const boatData = activeBoats.find(b => b.element === boatEl);
            if (boatData && !boatData.capsized) {
                boatData.capsized = true;
                const rockChild = boatEl.querySelector('.boat-rock');
                if (rockChild) rockChild.classList.add('capsized');

                score += 30;
                updateUI();
                showScorePop(x, y, 30, 1);

                const slogan = document.createElement('div');
                slogan.className = 'absolute z-50 bg-rose-600 text-white text-xs sm:text-sm font-black px-4 py-2 rounded-xl shadow-2xl animate-bounce pointer-events-none';
                slogan.style.left = `${Math.max(20, x - 80)}px`;
                slogan.style.top = `${Math.max(50, y - 60)}px`;
                slogan.textContent = '🛡️ 防衛成功！驅離入侵船隻！';
                document.body.appendChild(slogan);
                setTimeout(() => slogan.remove(), 1600);

                setTimeout(() => {
                    if (gameActive && boatData) {
                        boatData.capsized = false;
                        if (rockChild) rockChild.classList.remove('capsized');
                    }
                }, 4000);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameActive) {
                e.preventDefault();
                fireCannon();
            }
        });

        function collectTrash(e, element, basePoints) {
            if (!gameActive || element.classList.contains('collected')) return;
            element.classList.add('collected');

            combo++;
            clearTimeout(comboTimeout);
            showComboBanner();
            
            const multiplier = combo >= 5 ? 3 : (combo >= 3 ? 2 : 1);
            const earnedPoints = basePoints * multiplier;

            score += earnedPoints;
            remainingTrash--;
            updateUI();
            playSound('collect');

            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2;
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2;
            showScorePop(clientX, clientY, earnedPoints, multiplier);

            element.style.transition = 'all 0.3s ease-out';
            element.style.transform = 'scale(0) translateY(-40px) rotate(60deg)';
            element.style.opacity = '0';

            setTimeout(() => {
                element.remove();
                if (remainingTrash === 0) {
                    clearInterval(timerInterval);
                    endGame(true);
                }
            }, 300);

            comboTimeout = setTimeout(() => {
                combo = 0;
                hideComboBanner();
            }, 2500);
        }

        function showComboBanner() {
            if (combo >= 2) {
                const banner = document.getElementById('comboBanner');
                document.getElementById('comboCount').textContent = combo;
                banner.classList.remove('opacity-0', 'scale-50');
                banner.classList.add('opacity-100', 'scale-100', 'combo-pulse');
            }
        }

        function hideComboBanner() {
            const banner = document.getElementById('comboBanner');
            banner.classList.add('opacity-0', 'scale-50');
            banner.classList.remove('opacity-100', 'scale-100', 'combo-pulse');
        }

        function showScorePop(x, y, points, multiplier) {
            const pop = document.createElement('div');
            pop.className = `score-anim text-2xl sm:text-3xl ${multiplier > 1 ? 'text-amber-400' : 'text-emerald-500'}`;
            pop.style.left = `${x - 20}px`;
            pop.style.top = `${y - 25}px`;
            pop.textContent = `+${points}${multiplier > 1 ? ` (x${multiplier})` : ''}`;
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 700);
        }

        function updateUI() {
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('countDisplay').textContent = remainingTrash;
        }

        function endGame(isSuccess) {
            gameActive = false;
            hideComboBanner();

            let highScore = localStorage.getItem('sdg_beach_highscore') || 0;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('sdg_beach_highscore', highScore);
            }

            document.getElementById('finalScore').textContent = `${score} 分`;
            document.getElementById('highScore').textContent = `${highScore} 分`;

            const modalTitle = document.getElementById('modalTitle');
            const modalDesc = document.getElementById('modalDesc');
            const modalIcon = document.getElementById('modalIcon');
            const starRating = document.getElementById('starRating');

            if (isSuccess) {
                playSound('win');
                modalIcon.className = 'w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-inner';
                modalIcon.textContent = '🎉';
                modalTitle.textContent = '任務成功！';
                modalDesc.textContent = `太棒了！你在限時內成功清除所有海灘垃圾並防衛海洋，守護了美麗的藍色家園！`;
                
                if (timer > 20) {
                    starRating.textContent = '⭐ ⭐ ⭐';
                } else if (timer > 10) {
                    starRating.textContent = '⭐ ⭐ ☆';
                } else {
                    starRating.textContent = '⭐ ☆ ☆';
                }
                starRating.classList.remove('hidden');
            } else {
                playSound('gameover');
                modalIcon.className = 'w-20 h-20 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-inner';
                modalIcon.textContent = '⏰';
                modalTitle.textContent = '時間到！';
                modalDesc.textContent = `很可惜時間用完了，還有 ${remainingTrash} 個垃圾留在沙灘上。再接再厲挑戰一次吧！`;
                starRating.classList.add('hidden');
            }

            const modal = document.getElementById('victoryModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('modalContent').classList.remove('scale-95');
        }

        function restartGame() {
            initGame();
        }

        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
